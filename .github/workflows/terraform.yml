name: Terraform Infrastructure for LBG

on:
  push:
    branches: [ hk-LBG ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [ hk-LBG ]
    paths:
      - 'terraform/**'
  workflow_dispatch:  # Allows manual triggering with inputs
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - prod
      auto_approve:
        description: 'Auto-apply changes'
        required: false
        default: false
        type: boolean

env:
  TF_VERSION: '1.5.0'

# Prevent concurrent runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Planning Phase - Run for all environments
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]
    outputs:
      dev_plan_exists: ${{ steps.plan-check.outputs.dev_plan_exists }}
      staging_plan_exists: ${{ steps.plan-check.outputs.staging_plan_exists }}
      prod_plan_exists: ${{ steps.plan-check.outputs.prod_plan_exists }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Init
      run: terraform init -backend-config=environments/${{ matrix.environment }}/backend.conf
      env:
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Plan
      id: tf-plan
      run: |
        terraform plan -var-file=environments/${{ matrix.environment }}/terraform.tfvars -out=plan-${{ matrix.environment }}.tfplan
        echo "plan_file=plan-${{ matrix.environment }}.tfplan" >> $GITHUB_OUTPUT
        
        # Check if plan has changes
        if terraform show -json plan-${{ matrix.environment }}.tfplan | jq -e '.resource_changes | length > 0' > /dev/null; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi
      env:
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    - name: Upload Plan Artifact
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan-${{ matrix.environment }}
        path: terraform/plan-${{ matrix.environment }}.tfplan
        retention-days: 1

    - name: Check Plan Exists
      id: plan-check
      run: |
        if [ -f "plan-${{ matrix.environment }}.tfplan" ]; then
          echo "${matrix.environment}_plan_exists=true" >> $GITHUB_OUTPUT
        else
          echo "${matrix.environment}_plan_exists=false" >> $GITHUB_OUTPUT
        fi

  # Development Deployment - Auto-approved
  deploy-dev:
    name: 🚀 Deploy to Development
    runs-on: ubuntu-latest
    environment: dev
    needs: terraform-plan
    if: needs.terraform-plan.outputs.dev_plan_exists == 'true' || github.event.inputs.environment == 'dev'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Plan Artifact
      uses: actions/download-artifact@v4
      with:
        name: terraform-plan-dev
        path: terraform/

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Init
      run: terraform init -backend-config=environments/dev/backend.conf
      env:
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    - name: Terraform Apply
      run: terraform apply -auto-approve plan-dev.tfplan
      env:
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    - name: Verify Deployment
      run: |
        echo "✅ Development deployment completed successfully"
        echo "AKS Cluster: aks-dev-healthcare-lbg"
        echo "Kubernetes Version: 1.33.3"

  # Staging Deployment - Auto-approved but sequential
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    needs: 
      - terraform-plan
      - deploy-dev
    if: |
      (needs.terraform-plan.outputs.staging_plan_exists == 'true' && needs.deploy-dev.result == 'success') ||
      github.event.inputs.environment == 'staging'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Plan Artifact
      uses: actions/download-artifact@v4
      with:
        name: terraform-plan-staging
        path: terraform/

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Init
      run: terraform init -backend-config=environments/staging/backend.conf
      env:
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    - name: Terraform Apply
      run: terraform apply -auto-approve plan-staging.tfplan
      env:
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    - name: Verify Deployment
      run: |
        echo "✅ Staging deployment completed successfully"
        echo "AKS Cluster: aks-staging-healthcare-lbg"
        echo "Kubernetes Version: 1.33.3"

  # Production Deployment - REQUIRES MANUAL APPROVAL
  production-approval:
    name: ⚠️ Production Approval Required
    runs-on: ubuntu-latest
    environment: production
    needs: 
      - terraform-plan
      - deploy-staging
    if: |
      (needs.terraform-plan.outputs.prod_plan_exists == 'true' && needs.deploy-staging.result == 'success') ||
      github.event.inputs.environment == 'prod'
    
    steps:
    - name: Wait for manual approval
      run: |
        echo "🚨 PRODUCTION DEPLOYMENT PENDING APPROVAL"
        echo "Environment: Production"
        echo "Kubernetes Version: 1.33.3"
        echo "Cluster: aks-prod-healthcare-lbg"
        echo ""
        echo "Please review the Terraform plan and approve the deployment."
        echo "Check the 'Terraform Plan' job artifacts for detailed changes."
        
        # This step will pause and wait for manual approval in the GitHub UI
        echo "⏳ Waiting for manual approval..."

    - name: Approval Check
      run: |
        echo "✅ Production deployment approved!"
        echo "Proceeding with production deployment..."

  deploy-prod:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    needs: production-approval
    if: needs.production-approval.result == 'success'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Plan Artifact
      uses: actions/download-artifact@v4
      with:
        name: terraform-plan-prod
        path: terraform/

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Init
      run: terraform init -backend-config=environments/prod/backend.conf
      env:
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    - name: Terraform Apply
      run: terraform apply -auto-approve plan-prod.tfplan
      env:
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    - name: Verify Production Deployment
      run: |
        echo "✅ PRODUCTION DEPLOYMENT COMPLETED SUCCESSFULLY!"
        echo "🎉 All environments deployed successfully!"
        echo ""
        echo "📊 Deployment Summary:"
        echo "  - Development: ✅ AKS with 1.33.3"
        echo "  - Staging: ✅ AKS with 1.33.3"
        echo "  - Production: ✅ AKS with 1.33.3"
        echo ""
        echo "🚀 Healthcare LBG Application Infrastructure Ready!"

  # Final summary
  deployment-summary:
    name: 📊 Deployment Summary
    runs-on: ubuntu-latest
    needs: 
      - deploy-dev
      - deploy-staging
      - deploy-prod
    if: always()
    
    steps:
    - name: Generate Summary
      run: |
        echo "📊 TERRAFORM DEPLOYMENT SUMMARY"
        echo "================================"
        echo "Workflow: ${{ github.workflow }}"
        echo "Commit: ${{ github.sha }}"
        echo "Triggered by: ${{ github.actor }}"
        echo ""
        echo "Environment Status:"
        echo "  - Development: ${{ needs.deploy-dev.result }}"
        echo "  - Staging: ${{ needs.deploy-staging.result }}"
        echo "  - Production: ${{ needs.deploy-prod.result }}"
        echo ""
        echo "Kubernetes Version: 1.33.3"
        echo "Infrastructure: AKS Clusters with Azure Networking"