name: Build and Deploy Application for LBG

on:
  workflow_run:
    workflows: ["Terraform Infrastructure for LBG"]
    types:
      - completed
    branches: [hk-LBG]
  workflow_dispatch:  # Allows manual triggering

env:
  ACR_NAME: 'kamalj2kkkk'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Checkout code from triggering workflow
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Debug Information
      run: |
        echo "Triggering Workflow: ${{ github.event.workflow_run.name }}"
        echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
        echo "Head SHA: ${{ github.event.workflow_run.head_sha }}"
        ls -la

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.ACR_NAME }}.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Patient Service
      run: |
        cd src/patient-service
        docker build -t ${{ env.ACR_NAME }}.azurecr.io/patient-service:${{ github.event.workflow_run.head_sha }} .
        docker push ${{ env.ACR_NAME }}.azurecr.io/patient-service:${{ github.event.workflow_run.head_sha }}

    - name: Build and push Appointment Service
      run: |
        cd src/appointment-service
        docker build -t ${{ env.ACR_NAME }}.azurecr.io/appointment-service:${{ github.event.workflow_run.head_sha }} .
        docker push ${{ env.ACR_NAME }}.azurecr.io/appointment-service:${{ github.event.workflow_run.head_sha }}

  deploy-to-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Get AKS credentials
      uses: azure/aks-set-context@v3
      with:
        resource-group: rg-dev-healthcare-lbg
        cluster-name: aks-dev-healthcare-lbg

    - name: Install NGINX Ingress Controller
      run: |
        # Install NGINX Ingress Controller if not exists
        kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.2/deploy/static/provider/cloud/deploy.yaml
        
        # Wait for ingress controller
        kubectl wait --namespace ingress-nginx \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/component=controller \
          --timeout=300s

    - name: Deploy to Dev
      run: |
        # Create namespace
        kubectl create namespace healthcare-dev --dry-run=client -o yaml | kubectl apply -f -
        
        # Deploy services
        kubectl apply -f kubernetes/base/patient-service.yaml -n healthcare-dev
        kubectl apply -f kubernetes/base/appointment-service.yaml -n healthcare-dev
        kubectl apply -f kubernetes/dev/ingress.yaml -n healthcare-dev
        
        # Update images
        kubectl set image deployment/patient-service patient-service=${{ env.ACR_NAME }}.azurecr.io/patient-service:${{ github.event.workflow_run.head_sha }} -n healthcare-dev
        kubectl set image deployment/appointment-service appointment-service=${{ env.ACR_NAME }}.azurecr.io/appointment-service:${{ github.event.workflow_run.head_sha }} -n healthcare-dev
        
        # Wait for rollout
        kubectl rollout status deployment/patient-service -n healthcare-dev --timeout=300s
        kubectl rollout status deployment/appointment-service -n healthcare-dev --timeout=300s
        
        echo "✅ Dev deployment completed!"

  deploy-to-staging:
    needs: deploy-to-dev
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Get AKS credentials
      uses: azure/aks-set-context@v3
      with:
        resource-group: rg-staging-healthcare-lbg
        cluster-name: aks-staging-healthcare-lbg

    - name: Install NGINX Ingress Controller
      run: |
        kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.2/deploy/static/provider/cloud/deploy.yaml
        kubectl wait --namespace ingress-nginx \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/component=controller \
          --timeout=300s

    - name: Deploy to Staging
      run: |
        kubectl create namespace healthcare-staging --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -f kubernetes/base/patient-service.yaml -n healthcare-staging
        kubectl apply -f kubernetes/base/appointment-service.yaml -n healthcare-staging
        kubectl apply -f kubernetes/staging/ingress.yaml -n healthcare-staging
        
        kubectl set image deployment/patient-service patient-service=${{ env.ACR_NAME }}.azurecr.io/patient-service:${{ github.event.workflow_run.head_sha }} -n healthcare-staging
        kubectl set image deployment/appointment-service appointment-service=${{ env.ACR_NAME }}.azurecr.io/appointment-service:${{ github.event.workflow_run.head_sha }} -n healthcare-staging
        
        kubectl rollout status deployment/patient-service -n healthcare-staging --timeout=300s
        kubectl rollout status deployment/appointment-service -n healthcare-staging --timeout=300s
        
        echo "✅ Staging deployment completed!"

  deploy-to-prod:
    needs: deploy-to-staging
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Get AKS credentials
      uses: azure/aks-set-context@v3
      with:
        resource-group: rg-prod-healthcare-lbg
        cluster-name: aks-prod-healthcare-lbg

    - name: Install NGINX Ingress Controller
      run: |
        kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.2/deploy/static/provider/cloud/deploy.yaml
        kubectl wait --namespace ingress-nginx \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/component=controller \
          --timeout=300s

    - name: Deploy to Production
      run: |
        kubectl create namespace healthcare-prod --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -f kubernetes/base/patient-service.yaml -n healthcare-prod
        kubectl apply -f kubernetes/base/appointment-service.yaml -n healthcare-prod
        kubectl apply -f kubernetes/prod/ingress.yaml -n healthcare-prod
        
        kubectl set image deployment/patient-service patient-service=${{ env.ACR_NAME }}.azurecr.io/patient-service:${{ github.event.workflow_run.head_sha }} -n healthcare-prod
        kubectl set image deployment/appointment-service appointment-service=${{ env.ACR_NAME }}.azurecr.io/appointment-service:${{ github.event.workflow_run.head_sha }} -n healthcare-prod
        
        kubectl rollout status deployment/patient-service -n healthcare-prod --timeout=300s
        kubectl rollout status deployment/appointment-service -n healthcare-prod --timeout=300s
        
        echo "✅ Production deployment completed!"
        echo "🚀 All LBG environments deployed successfully!"