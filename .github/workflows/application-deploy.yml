name: Build and Deploy Application for LBG

on:
  push:
    branches: [ hk-LBG ]
    paths:
      - 'src/**'
      - 'kubernetes/**'
      - '.github/workflows/application-deploy.yml'
  workflow_dispatch:
  # REMOVED dependency on Terraform workflow to test independently

env:
  ACR_NAME: 'kamalj2kkkk'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.ACR_NAME }}.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Patient Service
      run: |
        echo "🏗️ Building Patient Service..."
        cd src/patient-service
        docker build -t ${{ env.ACR_NAME }}.azurecr.io/patient-service:${{ github.sha }} .
        docker push ${{ env.ACR_NAME }}.azurecr.io/patient-service:${{ github.sha }}

    - name: Build and push Appointment Service
      run: |
        echo "🏗️ Building Appointment Service..."
        cd src/appointment-service
        docker build -t ${{ env.ACR_NAME }}.azurecr.io/appointment-service:${{ github.sha }} .
        docker push ${{ env.ACR_NAME }}.azurecr.io/appointment-service:${{ github.sha }}

    - name: Verify Images
      run: |
        echo "✅ Verifying images in ACR..."
        az login --service-principal -u ${{ secrets.AZURE_CLIENT_ID }} -p ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }}
        az acr repository list --name ${{ env.ACR_NAME }} --output table

  deploy-to-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Get AKS credentials
      uses: azure/aks-set-context@v3
      with:
        resource-group: rg-dev-healthcare-lbg
        cluster-name: aks-dev-healthcare-lbg

    - name: Deploy to AKS Cluster
      run: |
        echo "🚀 Deploying to AKS cluster..."
        
        # Create namespace if not exists
        kubectl create namespace healthcare-dev --dry-run=client -o yaml | kubectl apply -f -
        
        # Deploy base services
        kubectl apply -f kubernetes/base/patient-service.yaml -n healthcare-dev
        kubectl apply -f kubernetes/base/appointment-service.yaml -n healthcare-dev
        kubectl apply -f kubernetes/dev/ingress.yaml -n healthcare-dev
        
        # Update images to newly built ones
        kubectl set image deployment/patient-service patient-service=${{ env.ACR_NAME }}.azurecr.io/patient-service:${{ github.sha }} -n healthcare-dev
        kubectl set image deployment/appointment-service appointment-service=${{ env.ACR_NAME }}.azurecr.io/appointment-service:${{ github.sha }} -n healthcare-dev
        
        # Wait for rollout
        kubectl rollout status deployment/patient-service -n healthcare-dev --timeout=300s
        kubectl rollout status deployment/appointment-service -n healthcare-dev --timeout=300s
        
        # Verify deployment
        kubectl get pods -n healthcare-dev
        kubectl get services -n healthcare-dev
        
        echo "✅ Dev deployment completed successfully!"