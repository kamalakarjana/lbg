name: Build and Deploy Application for LBG

on:
  workflow_run:
    workflows: ["Terraform Infrastructure for LBG"]
    types:
      - completed
    branches: [hk-LBG]
  workflow_dispatch:

env:
  ACR_NAME: 'kamalj2kkkk'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run && github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Checkout code from triggering workflow
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.ACR_NAME }}.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Patient Service
      run: |
        echo "🏗️ Building Patient Service..."
        cd src/patient-service
        docker build -t ${{ env.ACR_NAME }}.azurecr.io/patient-service:${{ github.event.workflow_run.head_sha }} .
        docker push ${{ env.ACR_NAME }}.azurecr.io/patient-service:${{ github.event.workflow_run.head_sha }}

    - name: Build and push Appointment Service
      run: |
        echo "🏗️ Building Appointment Service..."
        cd src/appointment-service
        docker build -t ${{ env.ACR_NAME }}.azurecr.io/appointment-service:${{ github.event.workflow_run.head_sha }} .
        docker push ${{ env.ACR_NAME }}.azurecr.io/appointment-service:${{ github.event.workflow_run.head_sha }}

  deploy-to-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Install envsubst
      run: sudo apt-get install -y gettext-base

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Get AKS credentials
      uses: azure/aks-set-context@v3
      with:
        resource-group: rg-dev-healthcare-lbg
        cluster-name: aks-dev-healthcare-lbg

    - name: Prepare Kubernetes Manifests
      run: |
        echo "📝 Preparing Kubernetes manifests for dev environment..."
        
        mkdir -p kubernetes/processed/dev
        
        export ENVIRONMENT="dev"
        export REPLICA_COUNT="2"
        export IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
        
        envsubst < kubernetes/base/namespace.yaml > kubernetes/processed/dev/namespace.yaml
        envsubst < kubernetes/base/patient-service.yaml > kubernetes/processed/dev/patient-service.yaml
        envsubst < kubernetes/base/appointment-service.yaml > kubernetes/processed/dev/appointment-service.yaml
        
        cp kubernetes/dev/ingress.yaml kubernetes/processed/dev/ingress.yaml
        
        echo "✅ Manifests prepared for dev environment"

    - name: Deploy to AKS Cluster
      run: |
        echo "🚀 Deploying to AKS cluster..."
        
        kubectl apply -f kubernetes/processed/dev/namespace.yaml
        kubectl apply -f kubernetes/processed/dev/patient-service.yaml
        kubectl apply -f kubernetes/processed/dev/appointment-service.yaml
        kubectl apply -f kubernetes/processed/dev/ingress.yaml
        
        kubectl rollout status deployment/patient-service -n healthcare-dev --timeout=300s
        kubectl rollout status deployment/appointment-service -n healthcare-dev --timeout=300s
        
        kubectl get pods -n healthcare-dev
        kubectl get services -n healthcare-dev
        
        echo "✅ Dev deployment completed successfully!"