name: Healthcare App CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  AZURE_CONTAINER_REGISTRY: 'acrhealthcareapp${{ github.run_number }}'
  RESOURCE_GROUP: 'rg-healthcare-app-${{ github.ref_name }}'
  CLUSTER_NAME: 'aks-healthcare-app-${{ github.ref_name }}'
  CLUSTER_RESOURCE_GROUP: 'rg-aks-healthcare-app-${{ github.ref_name }}'

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    - name: Terraform Format
      run: terraform fmt -check -recursive terraform/

    - name: Terraform Init
      run: terraform -chdir=terraform init -reconfigure
      env:
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    - name: Terraform Validate
      run: terraform -chdir=terraform validate

    - name: Terraform Plan
      if: github.event_name == 'pull_request'
      run: |
        terraform -chdir=terraform plan \
          -var-file="terraform.tfvars" \
          -var="docker_image_tags={\"patient_service\"=\"${{ github.sha }}\",\"appointment_service\"=\"${{ github.sha }}\"}" \
          -out=tfplan
      env:
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main'
      run: |
        terraform -chdir=terraform apply -auto-approve \
          -var-file="terraform.tfvars" \
          -var="docker_image_tags={\"patient_service\"=\"${{ github.sha }}\",\"appointment_service\"=\"${{ github.sha }}\"}"
      env:
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  build-and-deploy:
    name: 'Build and Deploy'
    runs-on: ubuntu-latest
    needs: terraform
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Patient Service
      uses: docker/build-push-action@v4
      with:
        context: ./patient-service
        file: ./patient-service/Dockerfile
        push: true
        tags: |
          ${{ secrets.ACR_LOGIN_SERVER }}/patient-service:${{ github.sha }}
          ${{ secrets.ACR_LOGIN_SERVER }}/patient-service:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Appointment Service
      uses: docker/build-push-action@v4
      with:
        context: ./appointment-service
        file: ./appointment-service/Dockerfile
        push: true
        tags: |
          ${{ secrets.ACR_LOGIN_SERVER }}/appointment-service:${{ github.sha }}
          ${{ secrets.ACR_LOGIN_SERVER }}/appointment-service:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.27.0'

    - name: Configure AKS credentials
      uses: azure/aks-set-context@v3
      with:
        resource-group: ${{ needs.terraform.outputs.resource_group_name }}
        cluster-name: ${{ needs.terraform.outputs.aks_cluster_name }}

    - name: Deploy to AKS
      run: |
        NAMESPACE="healthcare-${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}"
        kubectl set image deployment/patient-service patient-service=${{ secrets.ACR_LOGIN_SERVER }}/patient-service:${{ github.sha }} -n $NAMESPACE
        kubectl set image deployment/appointment-service appointment-service=${{ secrets.ACR_LO_

