name: Healthcare App CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  RESOURCE_GROUP: 'rg-healthcare-app-${{ github.ref_name }}'
  CLUSTER_NAME: 'aks-healthcare-app-${{ github.ref_name }}'

jobs:
  # Terraform Infrastructure CI/CD
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    
    outputs:
      resource_group_name: ${{ steps.set-outputs.outputs.resource_group_name }}
      aks_cluster_name: ${{ steps.set-outputs.outputs.aks_cluster_name }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure CLI Login
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    - name: Terraform Format
      id: fmt
      run: terraform fmt -check -recursive terraform/

    - name: Terraform Init
      id: init
      run: |
        cd terraform
        terraform init -input=false
      env:
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    - name: Terraform Validate
      id: validate
      run: terraform -chdir=terraform validate

    - name: Set outputs for other jobs
      id: set-outputs
      run: |
        echo "resource_group_name=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
        echo "aks_cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT

    - name: Terraform Plan
      id: plan
      if: github.event_name == 'pull_request'
      run: |
        cd terraform
        ENVIRONMENT="dev"
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          ENVIRONMENT="prod"
        fi

        terraform plan \
          -var="environment=$ENVIRONMENT" \
          -var="docker_image_tags={\"patient_service\"=\"${{ github.sha }}\",\"appointment_service\"=\"${{ github.sha }}\"}" \
          -out=tfplan
      env:
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    - name: Terraform Plan Status
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const output = `#### Terraform Format and Style ⚙️ \`${{ steps.fmt.outputs.exitcode }}\`
          #### Terraform Initialization ⚡ \`${{ steps.init.outputs.exitcode }}\`
          #### Terraform Validation 🤖 \`${{ steps.validate.outputs.exitcode }}\`
          #### Terraform Plan 📋 \`${{ steps.plan.outputs.exitcode }}\`

          <details><summary>Show Plan</summary>

          \`\`\`
          ${{ steps.plan.outputs.stdout }}
          \`\`\`

          </details>`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          })

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main'
      run: |
        cd terraform
        terraform apply -auto-approve \
          -var="environment=prod" \
          -var="docker_image_tags={\"patient_service\"=\"${{ github.sha }}\",\"appointment_service\"=\"${{ github.sha }}\"}"
      env:
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  # Application CI/CD
  build-and-deploy:
    name: 'Build and Deploy'
    runs-on: ubuntu-latest
    needs: terraform
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure CLI Login
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Azure Container Registry
      run: |
        az acr login --name ${{ secrets.ACR_NAME }}

    - name: Build and push Patient Service
      uses: docker/build-push-action@v4
      with:
        context: ./patient-service
        file: ./patient-service/Dockerfile
        push: true
        tags: |
          ${{ secrets.ACR_NAME }}.azurecr.io/patient-service:${{ github.sha }}
          ${{ secrets.ACR_NAME }}.azurecr.io/patient-service:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Appointment Service
      uses: docker/build-push-action@v4
      with:
        context: ./appointment-service
        file: ./appointment-service/Dockerfile
        push: true
        tags: |
          ${{ secrets.ACR_NAME }}.azurecr.io/appointment-service:${{ github.sha }}
          ${{ secrets.ACR_NAME }}.azurecr.io/appointment-service:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.27.0'

    - name: Configure AKS credentials
      run: |
        az aks get-credentials \
          --resource-group ${{ needs.terraform.outputs.resource_group_name }} \
          --name ${{ needs.terraform.outputs.aks_cluster_name }} \
          --overwrite-existing

    - name: Deploy to AKS
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          NAMESPACE="healthcare-prod"
        else
          NAMESPACE="healthcare-dev"
        fi

        # Create namespace if it doesn't exist
        kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

        # Deploy services (you'll need to have your Kubernetes manifests ready)
        kubectl apply -f kubernetes/manifests/ -n $NAMESPACE

        # Update images
        kubectl set image deployment/patient-service \
          patient-service=${{ secrets.ACR_NAME }}.azurecr.io/patient-service:${{ github.sha }} \
          -n $NAMESPACE

        kubectl set image deployment/appointment-service \
          appointment-service=${{ secrets.ACR_NAME }}.azurecr.io/appointment-service:${{ github.sha }} \
          -n $NAMESPACE

        # Wait for rollout
        kubectl rollout status deployment/patient-service -n $NAMESPACE --timeout=300s
        kubectl rollout status deployment/appointment-service -n $NAMESPACE --timeout=300s

    - name: Verify deployment
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          NAMESPACE="healthcare-prod"
        else
          NAMESPACE="healthcare-dev"
        fi
        
        echo "=== Pods ==="
        kubectl get pods -n $NAMESPACE
        
        echo "=== Services ==="
        kubectl get services -n $NAMESPACE
        
        echo "=== Deployments ==="
        kubectl get deployments -n $NAMESPACE

  # Integration Tests
  integration-tests:
    name: 'Integration Tests'
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure CLI Login
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3

    - name: Configure AKS credentials
      run: |
        az aks get-credentials \
          --resource-group ${{ needs.terraform.outputs.resource_group_name }} \
          --name ${{ needs.terraform.outputs.aks_cluster_name }} \
          --overwrite-existing

    - name: Run integration tests
      run: |
        NAMESPACE="healthcare-prod"
        
        # Wait for services to be ready
        echo "Waiting for services to be ready..."
        sleep 30
        
        # Get the ingress IP
        INGRESS_IP=$(kubectl get ingress healthcare-ingress -n $NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
        
        if [ -z "$INGRESS_IP" ]; then
          echo "Ingress IP not available yet, using service IPs instead"
          # Fallback to service IPs
          PATIENT_SVC_IP=$(kubectl get service patient-service -n $NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          APPOINTMENT_SVC_IP=$(kubectl get service appointment-service -n $NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          
          echo "Testing Patient Service..."
          curl -f http://$PATIENT_SVC_IP:8080/health || exit 1
          echo "Testing Appointment Service..."
          curl -f http://$APPOINTMENT_SVC_IP:8080/health || exit 1
        else
          echo "Testing through Ingress..."
          curl -f http://$INGRESS_IP/patients/health || exit 1
          curl -f http://$INGRESS_IP/appointments/health || exit 1
        fi
        
        echo "All integration tests passed!"