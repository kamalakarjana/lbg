name: Healthcare App CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  AZURE_CONTAINER_REGISTRY: 'acrhealthcareapp${{ github.run_number }}'
  RESOURCE_GROUP: 'rg-healthcare-app-${{ github.ref_name }}'
  CLUSTER_NAME: 'aks-healthcare-app-${{ github.ref_name }}'
  CLUSTER_RESOURCE_GROUP: 'rg-aks-healthcare-app-${{ github.ref_name }}'

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

    outputs:
      resource_group_name: ${{ steps.set-outputs.outputs.resource_group_name }}
      aks_cluster_name: ${{ steps.set-outputs.outputs.aks_cluster_name }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure CLI Login
      run: |
        az login --service-principal \
          -u ${{ secrets.AZURE_CLIENT_ID }} \
          -p ${{ secrets.AZURE_CLIENT_SECRET }} \
          --tenant ${{ secrets.AZURE_TENANT_ID }}
        
        az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Validate Azure Subscription
      run: |
        echo "🔎 Listing subscriptions..."
        az account list -o table
        echo "🔎 Current subscription:"
        az account show
        SUB_ID=$(az account show --query id -o tsv)
        if [ "$SUB_ID" != "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
          echo "❌ Wrong subscription in use: $SUB_ID"
          exit 1
        fi
        echo "✅ Using subscription: $SUB_ID"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    - name: Terraform Format
      run: terraform fmt -check -recursive terraform/

    - name: Clean Terraform directory
      run: |
        cd terraform
        rm -rf .terraform .terraform.lock.hcl *.tfstate* *.backup

    - name: Initialize Terraform Backend
      run: |
        cd terraform
        echo "⚡ Trying remote backend init..."
        if ! terraform init -input=false -reconfigure; then
          echo "⚠️ Remote backend failed. Falling back to local backend..."
          cat > backend_temp.tf << EOF
          terraform {
            backend "local" {
              path = "terraform.tfstate"
            }
          }
          EOF
          terraform init -input=false -reconfigure
        fi

    - name: Terraform Validate
      run: terraform -chdir=terraform validate

    - name: Set outputs for other jobs
      id: set-outputs
      run: |
        echo "resource_group_name=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
        echo "aks_cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT

    - name: Terraform Plan
      if: github.event_name == 'pull_request'
      run: |
        cd terraform
        ENVIRONMENT="dev"
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          ENVIRONMENT="prod"
        fi

        terraform plan \
          -var="environment=${ENVIRONMENT}" \
          -var="docker_image_tags={\"patient_service\"=\"${{ github.sha }}\",\"appointment_service\"=\"${{ github.sha }}\"}" \
          -out=tfplan

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main'
      run: |
        cd terraform
        terraform apply -auto-approve \
          -var="environment=prod" \
          -var="docker_image_tags={\"patient_service\"=\"${{ github.sha }}\",\"appointment_service\"=\"${{ github.sha }}\"}"

    - name: Cleanup Temporary Files
      if: always()
      run: |
        cd terraform
        rm -f backend_temp.tf

  build-and-deploy:
    name: 'Build and Deploy'
    runs-on: ubuntu-latest
    needs: terraform
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure CLI Login
      run: |
        az login --service-principal \
          -u ${{ secrets.AZURE_CLIENT_ID }} \
          -p ${{ secrets.AZURE_CLIENT_SECRET }} \
          --tenant ${{ secrets.AZURE_TENANT_ID }}
        
        az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Patient Service
      uses: docker/build-push-action@v4
      with:
        context: ./patient-service
        file: ./patient-service/Dockerfile
        push: true
        tags: |
          ${{ secrets.ACR_LOGIN_SERVER }}/patient-service:${{ github.sha }}
          ${{ secrets.ACR_LOGIN_SERVER }}/patient-service:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Appointment Service
      uses: docker/build-push-action@v4
      with:
        context: ./appointment-service
        file: ./appointment-service/Dockerfile
        push: true
        tags: |
          ${{ secrets.ACR_LOGIN_SERVER }}/appointment-service:${{ github.sha }}
          ${{ secrets.ACR_LOGIN_SERVER }}/appointment-service:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.27.0'

    - name: Configure AKS credentials
      uses: azure/aks-set-context@v3
      with:
        resource-group: ${{ needs.terraform.outputs.resource_group_name }}
        cluster-name: ${{ needs.terraform.outputs.aks_cluster_name }}

    - name: Deploy to AKS
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          NAMESPACE="healthcare-prod"
        else
          NAMESPACE="healthcare-dev"
        fi

        kubectl set image deployment/patient-service \
          patient-service=${{ secrets.ACR_LOGIN_SERVER }}/patient-service:${{ github.sha }} \
          -n $NAMESPACE

        kubectl set image deployment/appointment-service \
          appointment-service=${{ secrets.ACR_LOGIN_SERVER }}/appointment-service:${{ github.sha }} \
          -n $NAMESPACE

        kubectl rollout status deployment/patient-service \
          -n $NAMESPACE \
          --timeout=300s

        kubectl rollout status deployment/appointment-service \
          -n $NAMESPACE \
          --timeout=300s

    - name: Verify deployment
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          NAMESPACE="healthcare-prod"
        else
          NAMESPACE="healthcare-dev"
        fi
        
        kubectl get pods -n $NAMESPACE
        kubectl get services -n $NAMESPACE
        kubectl get ingress -n $NAMESPACE

  integration-tests:
    name: 'Integration Tests'
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure CLI Login
      run: |
        az login --service-principal \
          -u ${{ secrets.AZURE_CLIENT_ID }} \
          -p ${{ secrets.AZURE_CLIENT_SECRET }} \
          --tenant ${{ secrets.AZURE_TENANT_ID }}
        
        az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3

    - name: Configure AKS credentials
      uses: azure/aks-set-context@v3
      with:
        resource-group: ${{ needs.terraform.outputs.resource_group_name }}
        cluster-name: ${{ needs.terraform.outputs.aks_cluster_name }}

    - name: Run integration tests
      run: |
        INGRESS_IP=$(kubectl get ingress healthcare-ingress -n healthcare-prod -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        
        echo "Waiting for services to be ready..."
        sleep 60
        
        echo "Testing health endpoints..."
        curl -f http://$INGRESS_IP/patients/health || exit 1
        curl -f http://$INGRESS_IP/patients || exit 1
        curl -f http://$INGRESS_IP/appointments/health || exit 1
        curl -f http://$INGRESS_IP/appointments || exit 1

        echo "All integration tests passed!"
