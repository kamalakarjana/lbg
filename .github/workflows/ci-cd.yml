name: Healthcare App CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  RESOURCE_GROUP: 'rg-healthcare-app-${{ github.ref_name }}'
  CLUSTER_NAME: 'aks-healthcare-app-${{ github.ref_name }}'

jobs:
  # Terraform Infrastructure
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    
    outputs:
      resource_group_name: ${{ steps.set-outputs.outputs.resource_group_name }}
      aks_cluster_name: ${{ steps.set-outputs.outputs.aks_cluster_name }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      run: |
        az login --service-principal \
          -u ${{ secrets.AZURE_CLIENT_ID }} \
          -p ${{ secrets.AZURE_CLIENT_SECRET }} \
          --tenant ${{ secrets.AZURE_TENANT_ID }}
        az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2

    - name: Create Local Backend
      run: |
        cd terraform
        # Force local backend for CI/CD
        cat > backend_ci.tf << 'EOF'
terraform {
  backend "local" {}
}
EOF

    - name: Terraform Init
      run: terraform -chdir=terraform init

    - name: Terraform Validate
      run: terraform -chdir=terraform validate

    - name: Set outputs
      id: set-outputs
      run: |
        echo "resource_group_name=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
        echo "aks_cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT

    - name: Terraform Plan
      if: github.event_name == 'pull_request'
      run: |
        cd terraform
        terraform plan -out=tfplan

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main'
      run: |
        cd terraform
        terraform apply -auto-approve

  # Build and Push Docker Images
  build:
    name: 'Build Docker Images'
    runs-on: ubuntu-latest
    needs: terraform
    if: github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to ACR
      run: |
        echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_LOGIN_SERVER }} \
          -u ${{ secrets.ACR_USERNAME }} \
          --password-stdin

    - name: Build Patient Service
      run: |
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/patient-service:${{ github.sha }} ./patient-service
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/patient-service:${{ github.sha }}

    - name: Build Appointment Service
      run: |
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/appointment-service:${{ github.sha }} ./appointment-service
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/appointment-service:${{ github.sha }}

  # Deploy to Kubernetes
  deploy:
    name: 'Deploy to AKS'
    runs-on: ubuntu-latest
    needs: [terraform, build]
    if: github.event_name == 'push'
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      run: |
        az login --service-principal \
          -u ${{ secrets.AZURE_CLIENT_ID }} \
          -p ${{ secrets.AZURE_CLIENT_SECRET }} \
          --tenant ${{ secrets.AZURE_TENANT_ID }}

    - name: Get AKS Credentials
      run: |
        az aks get-credentials \
          --resource-group ${{ needs.terraform.outputs.resource_group_name }} \
          --name ${{ needs.terraform.outputs.aks_cluster_name }} \
          --overwrite-existing

    - name: Deploy Services
      run: |
        # Determine namespace
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          NAMESPACE="healthcare-prod"
        else
          NAMESPACE="healthcare-dev"
        fi

        # Create namespace
        kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

        # Deploy Patient Service
        kubectl create deployment patient-service \
          --image=${{ secrets.ACR_LOGIN_SERVER }}/patient-service:${{ github.sha }} \
          --port=8080 -n $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

        kubectl expose deployment patient-service \
          --port=80 --target-port=8080 -n $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

        # Deploy Appointment Service
        kubectl create deployment appointment-service \
          --image=${{ secrets.ACR_LOGIN_SERVER }}/appointment-service:${{ github.sha }} \
          --port=8080 -n $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

        kubectl expose deployment appointment-service \
          --port=80 --target-port=8080 -n $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

    - name: Verify Deployment
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          NAMESPACE="healthcare-prod"
        else
          NAMESPACE="healthcare-dev"
        fi

        kubectl get all -n $NAMESPACE