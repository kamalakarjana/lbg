name: Healthcare App CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  AZURE_CONTAINER_REGISTRY: 'acrhealthcareapp${{ github.run_number }}'
  RESOURCE_GROUP: 'rg-healthcare-app-${{ github.ref_name }}'
  CLUSTER_NAME: 'aks-healthcare-app-${{ github.ref_name }}'
  CLUSTER_RESOURCE_GROUP: 'rg-aks-healthcare-app-${{ github.ref_name }}'

jobs:
  # Terraform Infrastructure CI/CD
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    
    outputs:
      resource_group_name: ${{ steps.set-outputs.outputs.resource_group_name }}
      aks_cluster_name: ${{ steps.set-outputs.outputs.aks_cluster_name }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    - name: Terraform Format
      id: fmt
      run: terraform fmt -check -recursive terraform/

    - name: Clean Terraform directory
      id: clean
      run: |
        cd terraform
        rm -rf .terraform
        rm -f .terraform.lock.hcl

    - name: Terraform Init
      id: init
      run: |
        cd terraform
        terraform init -reconfigure -migrate-state -input=false
      env:
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    - name: Terraform Validate
      id: validate
      run: terraform -chdir=terraform validate

    - name: Set outputs for other jobs
      id: set-outputs
      run: |
        echo "resource_group_name=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
        echo "aks_cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT

    - name: Terraform Plan
      id: plan
      if: github.event_name == 'pull_request'
      run: |
        cd terraform
        ENVIRONMENT="dev"
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          ENVIRONMENT="prod"
        fi

        terraform plan \
          -var="environment=${ENVIRONMENT}" \
          -var="docker_image_tags={\"patient_service\"=\"${{ github.sha }}\",\"appointment_service\"=\"${{ github.sha }}\"}" \
          -out=tfplan
      env:
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    - name: Terraform Plan Status
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const output = `#### Terraform Format and Style âš™ï¸\`${{ steps.fmt.outputs.exitcode }}\`
          #### Terraform Initialization âš¡\`${{ steps.init.outputs.exitcode }}\`
          #### Terraform Validation ðŸ¤–\`${{ steps.validate.outputs.exitcode }}\`
          #### Terraform Plan ðŸ“‹\`${{ steps.plan.outputs.exitcode }}\`

          <details><summary>Show Plan</summary>

          \`\`\`\n
          ${{ steps.plan.outputs.stdout }}
          \`\`\`

          </details>`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          })

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main'
      run: |
        cd terraform
        terraform apply -auto-approve \
          -var="environment=prod" \
          -var="docker_image_tags={\"patient_service\"=\"${{ github.sha }}\",\"appointment_service\"=\"${{ github.sha }}\"}"
      env:
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  # Application CI/CD
  build-and-deploy:
    name: 'Build and Deploy'
    runs-on: ubuntu-latest
    needs: terraform
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Patient Service
      uses: docker/build-push-action@v4
      with:
        context: ./patient-service
        file: ./patient-service/Dockerfile
        push: true
        tags: |
          ${{ secrets.ACR_LOGIN_SERVER }}/patient-service:${{ github.sha }}
          ${{ secrets.ACR_LOGIN_SERVER }}/patient-service:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Appointment Service
      uses: docker/build-push-action@v4
      with:
        context: ./appointment-service
        file: ./appointment-service/Dockerfile
        push: true
        tags: |
          ${{ secrets.ACR_LOGIN_SERVER }}/appointment-service:${{ github.sha }}
          ${{ secrets.ACR_LOGIN_SERVER }}/appointment-service:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.27.0'

    - name: Configure AKS credentials
      uses: azure/aks-set-context@v3
      with:
        resource-group: ${{ needs.terraform.outputs.resource_group_name }}
        cluster-name: ${{ needs.terraform.outputs.aks_cluster_name }}

    - name: Deploy to AKS
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          NAMESPACE="healthcare-prod"
        else
          NAMESPACE="healthcare-dev"
        fi

        kubectl set image deployment/patient-service \
          patient-service=${{ secrets.ACR_LOGIN_SERVER }}/patient-service:${{ github.sha }} \
          -n $NAMESPACE

        kubectl set image deployment/appointment-service \
          appointment-service=${{ secrets.ACR_LOGIN_SERVER }}/appointment-service:${{ github.sha }} \
          -n $NAMESPACE

        kubectl rollout status deployment/patient-service \
          -n $NAMESPACE \
          --timeout=300s

        kubectl rollout status deployment/appointment-service \
          -n $NAMESPACE \
          --timeout=300s

    - name: Verify deployment
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          NAMESPACE="healthcare-prod"
        else
          NAMESPACE="healthcare-dev"
        fi
        
        kubectl get pods -n $NAMESPACE
        kubectl get services -n $NAMESPACE
        kubectl get ingress -n $NAMESPACE

  # Integration Tests
  integration-tests:
    name: 'Integration Tests'
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3

    - name: Configure AKS credentials
      uses: azure/aks-set-context@v3
      with:
        resource-group: ${{ needs.terraform.outputs.resource_group_name }}
        cluster-name: ${{ needs.terraform.outputs.aks_cluster_name }}

    - name: Run integration tests
      run: |
        INGRESS_IP=$(kubectl get ingress healthcare-ingress -n healthcare-prod -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        
        echo "Waiting for services to be ready..."
        sleep 60
        
        echo "Testing health endpoints..."
        curl -f http://$INGRESS_IP/patients/health || exit 1
        curl -f http://$INGRESS_IP/patients || exit 1
        curl -f http://$INGRESS_IP/appointments/health || exit 1
        curl -f http://$INGRESS_IP/appointments || exit 1

        echo "All integration tests passed!"
