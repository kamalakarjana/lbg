name: Healthcare App CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        options:
        - dev
        - staging
        - prod
      deploy_infra:
        type: boolean
        description: 'Deploy infrastructure with Terraform'
        required: true
        default: false

env:
  AZURE_CONTAINER_REGISTRY: healthcareappacr
  RESOURCE_GROUP: rg-healthcare-app
  TERRAFORM_VERSION: 1.5.0

jobs:
  # -------------------
  # Run Tests
  # -------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [patient-service, appointment-service]
    
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: src/${{ matrix.service }}/package-lock.json

    - name: Install dependencies
      run: |
        cd src/${{ matrix.service }}
        npm install

    - name: Run tests
      run: |
        cd src/${{ matrix.service }}
        npm test

  # -------------------
  # Build & Push Docker Images
  # -------------------
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        service: [patient-service, appointment-service]
    
    steps:
    - uses: actions/checkout@v4

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build & Push image
      run: |
        cd src/${{ matrix.service }}
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service }}:latest .
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service }}:latest

    - run: docker logout ${{ secrets.ACR_LOGIN_SERVER }}

  # -------------------
  # Terraform Plan for Dev/Staging/Prod
  # -------------------
  terraform-plan:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        environment: [dev, staging, prod]
    defaults:
      run:
        working-directory: ./terraform

    steps:
    - uses: actions/checkout@v4

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Terraform Format
      run: terraform fmt -check

    - name: Terraform Init
      run: |
        terraform init -backend-config="resource_group_name=tfstate" \
          -backend-config="storage_account_name=${{ secrets.TF_STATE_SA }}" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=${{ matrix.environment }}.tfstate"

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Plan (${{ matrix.environment }})
      id: plan
      run: terraform plan -var-file=environments/${{ matrix.environment }}.tfvars

    - name: Update PR with Plan
      uses: actions/github-script@v6
      with:
        script: |
          const env = "${{ matrix.environment }}";
          const output = `
          ### Terraform Plan for **${env}** 📖
          - Format: \`${{ steps.format.outcome }}\`
          - Validate: \`${{ steps.validate.outcome }}\`
          - Plan: \`${{ steps.plan.outcome }}\`

          <details><summary>Show Plan</summary>
          \`\`\`
          ${process.env.PLAN}
          \`\`\`
          </details>`;
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          })
      env:
        PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"

  # -------------------
  # Terraform Apply
  # -------------------
  terraform-apply:
    runs-on: ubuntu-latest
    needs: [test, build-and-push]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || 
        (github.event_name == 'workflow_dispatch' && inputs.deploy_infra)
    environment: 
      name: ${{ github.event.inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: ./terraform

    steps:
    - uses: actions/checkout@v4

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Terraform Init
      run: |
        ENV=${{ github.event.inputs.environment || 'dev' }}
        terraform init -backend-config="resource_group_name=tfstate" \
          -backend-config="storage_account_name=${{ secrets.TF_STATE_SA }}" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=$ENV.tfstate"

    - name: Terraform Apply
      run: |
        ENV=${{ github.event.inputs.environment || 'dev' }}
        terraform apply -var-file=environments/$ENV.tfvars -auto-approve

    - name: Output URLs
      run: |
        echo "Patient Service URL: $(terraform output -raw patient_service_url)"
        echo "Appointment Service URL: $(terraform output -raw appointment_service_url)"

  # -------------------
  # Deploy Apps
  # -------------------
  deploy-apps:
    runs-on: ubuntu-latest
    needs: [build-and-push, terraform-apply]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: 
      name: ${{ github.event.inputs.environment || 'dev' }}
    strategy:
      matrix:
        service: [patient, appointment]

    steps:
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ format('app-healthcareapp-{0}-{1}', matrix.service, github.event.inputs.environment || 'dev') }}
        images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service }}:latest
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

