name: Healthcare App CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  RESOURCE_GROUP: 'rg-healthcare-app-${{ github.ref_name }}'
  CLUSTER_NAME: 'aks-healthcare-app-${{ github.ref_name }}'

jobs:
  # Terraform Infrastructure CI/CD
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    
    outputs:
      resource_group_name: ${{ steps.set-outputs.outputs.resource_group_name }}
      aks_cluster_name: ${{ steps.set-outputs.outputs.aks_cluster_name }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure CLI Login
      run: |
        az login --service-principal \
          -u ${{ secrets.AZURE_CLIENT_ID }} \
          -p ${{ secrets.AZURE_CLIENT_SECRET }} \
          --tenant ${{ secrets.AZURE_TENANT_ID }}
        az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    - name: Terraform Format
      id: fmt
      run: terraform fmt -check -recursive terraform/

    - name: Terraform Init
      id: init
      run: |
        cd terraform
        terraform init -input=false
      env:
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    - name: Terraform Validate
      id: validate
      run: terraform -chdir=terraform validate

    - name: Set outputs for other jobs
      id: set-outputs
      run: |
        echo "resource_group_name=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
        echo "aks_cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT

    - name: Terraform Plan
      id: plan
      if: github.event_name == 'pull_request'
      run: |
        cd terraform
        ENVIRONMENT="dev"
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          ENVIRONMENT="prod"
        fi

        terraform plan \
          -var="environment=$ENVIRONMENT" \
          -var="docker_image_tags={\"patient_service\"=\"${{ github.sha }}\",\"appointment_service\"=\"${{ github.sha }}\"}" \
          -out=tfplan
      env:
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    - name: Terraform Plan Status
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const output = `#### Terraform Format and Style ⚙️ \`${{ steps.fmt.outputs.exitcode }}\`
          #### Terraform Initialization ⚡ \`${{ steps.init.outputs.exitcode }}\`
          #### Terraform Validation 🤖 \`${{ steps.validate.outputs.exitcode }}\`
          #### Terraform Plan 📋 \`${{ steps.plan.outputs.exitcode }}\`

          <details><summary>Show Plan</summary>

          \`\`\`
          ${{ steps.plan.outputs.stdout }}
          \`\`\`

          </details>`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          })

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main'
      run: |
        cd terraform
        terraform apply -auto-approve \
          -var="environment=prod" \
          -var="docker_image_tags={\"patient_service\"=\"${{ github.sha }}\",\"appointment_service\"=\"${{ github.sha }}\"}"
      env:
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  # Application CI/CD
  build-and-deploy:
    name: 'Build and Deploy'
    runs-on: ubuntu-latest
    needs: terraform
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure CLI Login
      run: |
        az login --service-principal \
          -u ${{ secrets.AZURE_CLIENT_ID }} \
          -p ${{ secrets.AZURE_CLIENT_SECRET }} \
          --tenant ${{ secrets.AZURE_TENANT_ID }}
        az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Azure Container Registry
      run: |
        echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_LOGIN_SERVER }} \
          -u ${{ secrets.ACR_USERNAME }} \
          --password-stdin

    - name: Build and push Patient Service
      uses: docker/build-push-action@v4
      with:
        context: ./patient-service
        file: ./patient-service/Dockerfile
        push: true
        tags: |
          ${{ secrets.ACR_LOGIN_SERVER }}/patient-service:${{ github.sha }}
          ${{ secrets.ACR_LOGIN_SERVER }}/patient-service:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Appointment Service
      uses: docker/build-push-action@v4
      with:
        context: ./appointment-service
        file: ./appointment-service/Dockerfile
        push: true
        tags: |
          ${{ secrets.ACR_LOGIN_SERVER }}/appointment-service:${{ github.sha }}
          ${{ secrets.ACR_LOGIN_SERVER }}/appointment-service:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.27.0'

    - name: Configure AKS credentials
      run: |
        az aks get-credentials \
          --resource-group ${{ needs.terraform.outputs.resource_group_name }} \
          --name ${{ needs.terraform.outputs.aks_cluster_name }} \
          --overwrite-existing

    - name: Deploy to AKS
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          NAMESPACE="healthcare-prod"
        else
          NAMESPACE="healthcare-dev"
        fi

        # Create namespace if it doesn't exist
        kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

        # Apply Kubernetes manifests (you need to create these files)
        if [ -d "kubernetes/manifests" ]; then
          kubectl apply -f kubernetes/manifests/ -n $NAMESPACE
        else
          echo "Kubernetes manifests directory not found, creating basic deployments..."
          
          # Create patient-service deployment if it doesn't exist
          if ! kubectl get deployment patient-service -n $NAMESPACE &>/dev/null; then
            cat <<EOF | kubectl apply -n $NAMESPACE -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: patient-service
  template:
    metadata:
      labels:
        app: patient-service
    spec:
      containers:
      - name: patient-service
        image: ${{ secrets.ACR_LOGIN_SERVER }}/patient-service:${{ github.sha }}
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: patient-service
spec:
  selector:
    app: patient-service
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
EOF
          fi

          # Create appointment-service deployment if it doesn't exist
          if ! kubectl get deployment appointment-service -n $NAMESPACE &>/dev/null; then
            cat <<EOF | kubectl apply -n $NAMESPACE -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: appointment-service
  template:
    metadata:
      labels:
        app: appointment-service
    spec:
      containers:
      - name: appointment-service
        image: ${{ secrets.ACR_LOGIN_SERVER }}/appointment-service:${{ github.sha }}
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: appointment-service
spec:
  selector:
    app: appointment-service
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
EOF
          fi
        fi

        # Update images
        kubectl set image deployment/patient-service \
          patient-service=${{ secrets.ACR_LOGIN_SERVER }}/patient-service:${{ github.sha }} \
          -n $NAMESPACE

        kubectl set image deployment/appointment-service \
          appointment-service=${{ secrets.ACR_LOGIN_SERVER }}/appointment-service:${{ github.sha }} \
          -n $NAMESPACE

        # Wait for rollout
        kubectl rollout status deployment/patient-service -n $NAMESPACE --timeout=300s
        kubectl rollout status deployment/appointment-service -n $NAMESPACE --timeout=300s

    - name: Verify deployment
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          NAMESPACE="healthcare-prod"
        else
          NAMESPACE="healthcare-dev"
        fi
        
        echo "=== Pods ==="
        kubectl get pods -n $NAMESPACE
        
        echo "=== Services ==="
        kubectl get services -n $NAMESPACE
        
        echo "=== Deployments ==="
        kubectl get deployments -n $NAMESPACE

  # Integration Tests
  integration-tests:
    name: 'Integration Tests'
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure CLI Login
      run: |
        az login --service-principal \
          -u ${{ secrets.AZURE_CLIENT_ID }} \
          -p ${{ secrets.AZURE_CLIENT_SECRET }} \
          --tenant ${{ secrets.AZURE_TENANT_ID }}
        az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3

    - name: Configure AKS credentials
      run: |
        az aks get-credentials \
          --resource-group ${{ needs.terraform.outputs.resource_group_name }} \
          --name ${{ needs.terraform.outputs.aks_cluster_name }} \
          --overwrite-existing

    - name: Run integration tests
      run: |
        NAMESPACE="healthcare-prod"
        
        # Wait for services to be ready
        echo "Waiting for services to be ready..."
        sleep 30
        
        # Test using port-forward
        echo "=== Running Integration Tests ==="
        
        # Test Patient Service
        PATIENT_POD=$(kubectl get pods -n $NAMESPACE -l app=patient-service -o jsonpath='{.items[0].metadata.name}')
        if [ -n "$PATIENT_POD" ]; then
          echo "Testing Patient Service..."
          timeout 30s kubectl port-forward pod/$PATIENT_POD 8080:8080 -n $NAMESPACE &
          PF_PID=$!
          sleep 10
          curl -f http://localhost:8080/health && echo "Patient Service Health: OK" || echo "Patient Service Health: FAILED"
          kill $PF_PID 2>/dev/null || true
        fi
        
        # Test Appointment Service  
        APPOINTMENT_POD=$(kubectl get pods -n $NAMESPACE -l app=appointment-service -o jsonpath='{.items[0].metadata.name}')
        if [ -n "$APPOINTMENT_POD" ]; then
          echo "Testing Appointment Service..."
          timeout 30s kubectl port-forward pod/$APPOINTMENT_POD 8081:8080 -n $NAMESPACE &
          PF_PID=$!
          sleep 10
          curl -f http://localhost:8081/health && echo "Appointment Service Health: OK" || echo "Appointment Service Health: FAILED"
          kill $PF_PID 2>/dev/null || true
        fi
        
        echo "Integration tests completed!"