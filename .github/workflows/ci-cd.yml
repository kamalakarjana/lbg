name: 🚀 LBG Application CI/CD Pipeline

on:
  push:
    branches: [main, qwert]
  pull_request:
    branches: [main]

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  NODE_VERSION: '18'
  TERRAFORM_VERSION: '1.5.0'
  HELM_VERSION: '3.14.0'

  
jobs:
  🔧 Infrastructure-Provisioning:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 🔐 Azure Cloud Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 📊 Get Current AKS Version
        id: get_aks_version
        run: |
          CURRENT_VERSION=$(az aks show --name lbg-aks-cluster-dev --resource-group rg-lbg-demo-dev --query kubernetesVersion -o tsv)
          echo "🔍 Current AKS version: $CURRENT_VERSION"
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: 🏗️ Terraform Initialize
        run: |
          cd infrastructure
          terraform init \
            -backend-config="resource_group_name=rg-lbg-demo-dev" \
            -backend-config="storage_account_name=tfstatestorageacc0212" \
            -backend-config="container_name=lbg-02-12-1994" \
            -backend-config="key=terraform.lbg-02-12-1994"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: ✅ Terraform Validate
        run: |
          cd infrastructure
          terraform validate
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: 📝 Terraform Format Check
        run: |
          cd infrastructure
          terraform fmt -recursive -check

      - name: 📋 Terraform Plan
        run: |
          cd infrastructure
          terraform plan \
            -var="environment=dev" \
            -var="resource_group_name=rg-lbg-demo-dev" \
            -var="location=Central US" \
            -var="acr_name=acrlbgdemodev" \
            -var="aks_cluster_name=lbg-aks-cluster" \
            -var="vnet_name=vnet-dev-lbg-app" \
            -var="public_ip_name=pip-lb-dev-lbg-app" \
            -var="vm_size=Standard_D2s_v3" \
            -var="kubernetes_version=${{ steps.get_aks_version.outputs.current_version || '1.33.3' }}" \
            -var="min_count=1" \
            -var="max_count=5" \
            -out=tfplan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: 🚀 Terraform Apply
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/qwert'
        run: |
          cd infrastructure
          echo "🔄 Applying Terraform plan on branch: ${{ github.ref }}"
          terraform apply -auto-approve tfplan
          echo "✅ Terraform apply completed successfully"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  🐳 Container-Build-Push:
    runs-on: ubuntu-latest
    needs: 🔧 Infrastructure-Provisioning
    strategy:
      matrix:
        service: [patient-service, appointment-service]
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install Dependencies
        run: |
          cd ${{ matrix.service }}
          echo "📥 Installing dependencies for ${{ matrix.service }}..."
          npm install

      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Azure Container Registry
        run: |
          az login --service-principal \
            -u ${{ secrets.AZURE_CLIENT_ID }} \
            -p ${{ secrets.AZURE_CLIENT_SECRET }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }}
          az acr login --name acrlbgdemodev

      - name: 🏗️ Build Docker Image
        run: |
          cd ${{ matrix.service }}
          echo "🏗️ Building Docker image for ${{ matrix.service }}..."
          docker build \
            --tag ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ github.sha }} \
            --tag ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service }}:latest \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg VCS_REF=${{ github.sha }} \
            --build-arg VERSION=1.0.0 \
            .
          echo "✅ Docker image built successfully"

      - name: 📤 Push Docker Image
        run: |
          echo "📤 Pushing Docker images for ${{ matrix.service }}..."
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service }}:latest
          echo "✅ Successfully pushed ${{ matrix.service }}:${{ github.sha }}"

  🔒 Security-Scanning:
    runs-on: ubuntu-latest
    needs: 🐳 Container-Build-Push
    strategy:
      matrix:
        service: [patient-service, appointment-service]
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🛡️ Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: '${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ github.sha }}'
          format: 'sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: 1

      - name: 📊 Upload Trivy Results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results-${{ matrix.service }}.sarif

      - name: 🔍 Run NPM Security Audit
        run: |
          echo "🔍 Running npm audit for ${{ matrix.service }}..."
          cd ${{ matrix.service }}
          npm audit --audit-level high || echo "⚠️ Audit completed with findings"

      - name: 📦 Dependency Check
        run: |
          echo "📦 Checking dependencies for ${{ matrix.service }}..."
          cd ${{ matrix.service }}
          npm outdated || echo "ℹ️ Some dependencies may be outdated"

  🚀 Application-Deployment:
    runs-on: ubuntu-latest
    needs: [🔧 Infrastructure-Provisioning, 🐳 Container-Build-Push, 🔒 Security-Scanning]
    environment: dev
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Install Helm
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh --version v${{ env.HELM_VERSION }}
          helm version

      - name: 🔐 Configure Azure Credentials
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🔗 Get AKS Cluster Credentials
        run: |
          az aks get-credentials \
            --resource-group rg-lbg-demo-dev \
            --name lbg-aks-cluster-dev \
            --overwrite-existing

      - name: 🌐 Setup Kubernetes Context
        run: |
          echo "🔍 Current Kubernetes context:"
          kubectl config current-context
          echo "🖥️ Cluster nodes:"
          kubectl get nodes

      - name: 🛣️ Install Nginx Ingress Controller
        run: |
          echo "🛣️ Installing Nginx Ingress Controller..."
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --create-namespace \
            --set controller.service.type=LoadBalancer \
            --set controller.ingressClassResource.name=nginx \
            --set controller.ingressClassResource.controllerValue="k8s.io/ingress-nginx" \
            --wait \
            --timeout 5m
          echo "✅ Nginx ingress controller installed"

      - name: 📁 Handle Kubernetes Namespace
        run: |
          if kubectl get namespace lbg-ns >/dev/null 2>&1; then
            echo "📁 Namespace lbg-ns already exists"
            if helm list -n lbg-ns -q | grep -q "lbg-app"; then
              echo "🔄 Helm release 'lbg-app' exists, performing upgrade"
            else
              echo "🧹 No Helm release found. Cleaning namespace..."
              kubectl delete namespace lbg-ns
              if kubectl wait --for=delete namespace/lbg-ns --timeout=120s 2>/dev/null; then
                echo "✅ Namespace deleted successfully"
              else
                echo "✅ Namespace deletion completed"
              fi
              sleep 10
            fi
          else
            echo "📁 Namespace lbg-ns does not exist, will be created"
          fi

      - name: 🔑 Create ACR Pull Secret
        run: |
          kubectl create namespace lbg-ns --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry acr-secret \
            --namespace lbg-ns \
            --docker-server=${{ secrets.ACR_LOGIN_SERVER }} \
            --docker-username=${{ secrets.AZURE_CLIENT_ID }} \
            --docker-password=${{ secrets.AZURE_CLIENT_SECRET }} \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "✅ ACR pull secret created/updated"

      - name: 🎯 Deploy Application with Helm
        run: |
          cd kubernetes/helm
          echo "🎯 Deploying application with Helm..."
          
          # Dry run first
          helm template lbg-app . \
            --namespace lbg-ns \
            -f values-dev.yml \
            --set patientService.tag=${{ github.sha }} \
            --set appointmentService.tag=${{ github.sha }} \
            --set image.registry=${{ secrets.ACR_LOGIN_SERVER }}
          
          # Actual deployment
          helm upgrade --install lbg-app . \
            --namespace lbg-ns \
            --wait \
            --timeout 15m \
            -f values-dev.yml \
            --set patientService.tag=${{ github.sha }} \
            --set appointmentService.tag=${{ github.sha }} \
            --set image.registry=${{ secrets.ACR_LOGIN_SERVER }} \
            --atomic
          echo "✅ Helm deployment completed"

      - name: 📊 Deployment Verification
        run: |
          echo "📊 Verifying deployment..."
          kubectl get all -n lbg-ns
          echo ""
          kubectl get ingress -n lbg-ns 2>/dev/null || echo "ℹ️ No ingress found yet"
          echo ""
          kubectl get hpa -n lbg-ns 2>/dev/null || echo "ℹ️ HPA not configured"

      - name: ❤️ Health Checks & Probes Validation
        run: |
          echo "❤️ Running Comprehensive Health Checks..."
          
          # Wait for pods to be ready (validates readiness probes)
          echo "⏳ Waiting for pods to be ready..."
          kubectl wait --for=condition=ready pod -l app=patient-service -n lbg-ns --timeout=300s
          kubectl wait --for=condition=ready pod -l app=appointment-service -n lbg-ns --timeout=300s
          echo "✅ All pods ready - Readiness probes passing"
          
          # Check pod status
          echo "📋 Pod Status:"
          kubectl get pods -n lbg-ns -o wide

      - name: 🔍 Service Connectivity Tests
        run: |
          echo "🔍 Testing Service Connectivity..."
          kubectl run -it --rm --restart=Never connectivity-test --image=curlimages/curl --namespace=lbg-ns --command -- sh -c "
            echo '👨‍⚕️ Testing Patient Service...'
            if curl -s -f -m 10 http://patient-service:3000/health; then
              echo '✅ Patient Service: HEALTHY'
              echo '📊 Response:'; curl -s http://patient-service:3000/health | head -c 100; echo ''
            else
              echo '❌ Patient Service: UNHEALTHY'
            fi
            
            echo ''
            echo '📅 Testing Appointment Service...'
            if curl -s -f -m 10 http://appointment-service:3001/health; then
              echo '✅ Appointment Service: HEALTHY'
              echo '📊 Response:'; curl -s http://appointment-service:3001/health | head -c 100; echo ''
            else
              echo '❌ Appointment Service: UNHEALTHY'
            fi
          "

      - name: 🔄 Cross-Service Communication Tests
        run: |
          echo "🔄 Testing Cross-Service Communication..."
          kubectl run -it --rm --restart=Never cross-service-test --image=curlimages/curl --namespace=lbg-ns --command -- sh -c "
            echo '🔄 Testing Patient -> Appointment communication...'
            if curl -s -f -m 10 http://appointment-service:3001/health; then
              echo '✅ Patient -> Appointment: COMMUNICATION OK'
            else
              echo '❌ Patient -> Appointment: COMMUNICATION FAILED'
            fi
            
            echo ''
            echo '🔄 Testing Appointment -> Patient communication...'
            if curl -s -f -m 10 http://patient-service:3000/health; then
              echo '✅ Appointment -> Patient: COMMUNICATION OK'
            else
              echo '❌ Appointment -> Patient: COMMUNICATION FAILED'
            fi
          "

      - name: 🌐 Ingress & Browser Access Tests
        run: |
          echo "🌐 Testing Ingress & Browser Access..."
          EXTERNAL_IP=$(kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          if [ -n "$EXTERNAL_IP" ]; then
            echo "🌍 External IP: $EXTERNAL_IP"
            echo ""
            
            # Test all ingress endpoints
            endpoints=("health" "patients" "appointments")
            for endpoint in "${endpoints[@]}"; do
              URL="http://$EXTERNAL_IP/$endpoint"
              echo "🔗 Testing $endpoint endpoint..."
              if curl -s -f -m 10 "$URL" > /dev/null; then
                echo "✅ $endpoint: ACCESSIBLE VIA INGRESS"
                RESPONSE=$(curl -s "$URL" | head -c 150)
                echo "📄 Response preview: $RESPONSE..."
              else
                echo "❌ $endpoint: INACCESSIBLE VIA INGRESS"
              fi
              echo ""
            done
            
            # Display access instructions
            echo "🎯 Browser Access Instructions:"
            echo "========================================"
            echo "Add to /etc/hosts: $EXTERNAL_IP lbg-app.dev.local"
            echo ""
            echo "🌐 Access URLs:"
            echo "   👨‍⚕️  Patient Service:    http://lbg-app.dev.local/patients"
            echo "   📅 Appointment Service: http://lbg-app.dev.local/appointments"
            echo "   ❤️  Health Check:       http://lbg-app.dev.local/health"
            echo ""
          else
            echo "⚠️ No external IP assigned yet (may take a few minutes)"
            echo "💡 Check ingress controller: kubectl get svc -n ingress-nginx"
          fi

      - name: 📈 Performance & Resource Checks
        run: |
          echo "📈 Performance & Resource Monitoring..."
          echo "💾 Resource Usage:"
          kubectl top pods -n lbg-ns 2>/dev/null || echo "ℹ️ Metrics server not available"
          echo ""
          echo "📊 Pod Resource Limits:"
          kubectl get pods -n lbg-ns -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.containers[*].resources.limits.cpu}{"\t"}{.spec.containers[*].resources.limits.memory}{"\n"}{end}' || echo "ℹ️ No resource limits set"

      - name: 🎉 Deployment Success Summary
        run: |
          echo ""
          echo "🎉 🎉 🎉 DEPLOYMENT COMPLETED SUCCESSFULLY! 🎉 🎉 🎉"
          echo "================================================"
          echo ""
          echo "📋 Application Status:"
          kubectl get pods,svc,ingress -n lbg-ns
          echo ""
          echo "🔧 Troubleshooting Commands:"
          echo "   View logs: kubectl logs -n lbg-ns deployment/patient-service"
          echo "   Check ingress: kubectl describe ingress -n lbg-ns"
          echo "   Pod details: kubectl describe pod -n lbg-ns -l app=patient-service"
          echo ""
          echo "🚀 Next Steps:"
          echo "   1. Add External IP to hosts file for browser access"
          echo "   2. Monitor application logs for any issues"
          echo "   3. Test all endpoints in browser"

  🧹 Cleanup-Resources:
    runs-on: ubuntu-latest
    if: always()
    needs: 🚀 Application-Deployment
    steps:
      - name: 🗑️ Cleanup Docker Resources
        run: |
          echo "🧹 Cleaning up Docker resources..."
          docker system prune -f
          echo "✅ Cleanup completed"