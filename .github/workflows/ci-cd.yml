name: Healthcare App CI/CD

on:
  push:
    branches:
      - main
      - lbg-demo
  pull_request:
    branches:
      - main
      - lbg-demo
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - prod
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

env:
  RESOURCE_GROUP_NAME: healthcare-app-rg-dev
  ACR_NAME: kamalj2kkkk
  REGISTRY: kamalj2kkkk.azurecr.io
  NAMESPACE: healthcare-ns-dev
  STORAGE_ACCOUNT_NAME: tfstatestorageacc160689
  AKS_CLUSTER_NAME: healthcare-aks-cluster-dev
  HELM_EXPERIMENTAL_OCI: 1
  HELM_CHART_DIR: kubernetes/helm
  HELM_RELEASE_NAME: healthcare-app-dev

jobs:
  # PHASE 1: CHECKOUT & SETUP
  checkout_and_setup:
    name: "1. Checkout & Setup"
    runs-on: ubuntu-latest
    outputs:
      skip_tests: ${{ steps.set_skip_tests.outputs.skip_tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set skip tests flag
        id: set_skip_tests
        run: |
          if [ "${{ github.event.inputs.skip_tests }}" = "true" ]; then
            echo "skip_tests=true" >> $GITHUB_OUTPUT
          else
            echo "skip_tests=false" >> $GITHUB_OUTPUT
          fi

  # PHASE 2: CODE ANALYSIS & TESTING WITH SONARCLOUD
  code_analysis:
    name: "2. Code Analysis & Testing"
    runs-on: ubuntu-latest
    needs: checkout_and_setup
    if: needs.checkout_and_setup.outputs.skip_tests == 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            src/patient-service/package-lock.json
            src/appointment-service/package-lock.json

      - name: Install dependencies for Patient Service
        run: |
          echo "Installing dependencies for Patient Service..."
          cd src/patient-service
          npm install
          cd ../..

      - name: Install dependencies for Appointment Service
        run: |
          echo "Installing dependencies for Appointment Service..."
          cd src/appointment-service
          npm install
          cd ../..

      - name: Run linting for Patient Service
        run: |
          cd src/patient-service
          npm run lint || echo "Linting completed with warnings"

      - name: Run linting for Appointment Service
        run: |
          cd src/appointment-service
          npm run lint || echo "Linting completed with warnings"

      - name: Run tests with coverage for Patient Service
        run: |
          cd src/patient-service
          npm test
          echo "Patient Service tests completed"

      - name: Run tests with coverage for Appointment Service
        run: |
          cd src/appointment-service
          npm test
          echo "Appointment Service tests completed"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            src/patient-service/coverage/
            src/appointment-service/coverage/
          retention-days: 7

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=kamalakarjana
            -Dsonar.projectKey=kamalakarjana_lbg
            -Dsonar.projectName=lbg
            -Dsonar.projectVersion=2.1.0
            -Dsonar.sources=src/
            -Dsonar.tests=src/
            -Dsonar.javascript.lcov.reportPaths=src/patient-service/coverage/lcov.info,src/appointment-service/coverage/lcov.info
            -Dsonar.coverage.exclusions=**/node_modules/**,**/*.test.js
            -Dsonar.scm.disabled=true
            -Dsonar.analysis.automatic=false
            -Dsonar.exclusions=**/Dockerfile,**/node_modules/**,**/coverage/**,**/*.yaml,**/*.yml,**/*.json,**/*.md,**/*.lock,terraform/**,kubernetes/**,**/jest.config.js,**/package.json,**/package-lock.json
            -Dsonar.test.exclusions=**/Dockerfile,**/node_modules/**,**/coverage/**,**/*.yaml,**/*.yml,**/*.json,**/*.md,**/*.lock,terraform/**,kubernetes/**,**/jest.config.js,**/package.json,**/package-lock.json
            -Dsonar.test.inclusions=**/*.test.js

  # PHASE 3: BUILD & PUSH DOCKER IMAGES
  build_and_push_images:
    name: "3. Build & Push Docker Images"
    runs-on: ubuntu-latest
    needs: 
      - checkout_and_setup
      - code_analysis
    if: |
      always() && 
      (needs.code_analysis.result == 'success' || 
       needs.code_analysis.result == 'skipped' ||
       needs.checkout_and_setup.outputs.skip_tests == 'true')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/patient-service
            ${{ env.REGISTRY }}/appointment-service
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Patient Service
        uses: docker/build-push-action@v5
        with:
          context: ./src/patient-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/patient-service:${{ github.sha }}
            ${{ env.REGISTRY }}/patient-service:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build and push Appointment Service
        uses: docker/build-push-action@v5
        with:
          context: ./src/appointment-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/appointment-service:${{ github.sha }}
            ${{ env.REGISTRY }}/appointment-service:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Verify pushed images
        run: |
          echo "=== ACR Repository List ==="
          az acr repository list --name ${{ env.ACR_NAME }} --output table
          
          echo "=== Patient Service Tags ==="
          az acr repository show-tags --name ${{ env.ACR_NAME }} --repository patient-service --output table
          
          echo "=== Appointment Service Tags ==="
          az acr repository show-tags --name ${{ env.ACR_NAME }} --repository appointment-service --output table
          
          echo "✅ All images built and pushed successfully to ACR"

  # PHASE 4: SECURITY SCAN ACR IMAGES
  security_scan_acr:
    name: "4. Security Scan ACR Images"
    runs-on: ubuntu-latest
    needs: build_and_push_images
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Scan Patient Service image
        run: |
          echo "🔍 Scanning Patient Service image for vulnerabilities..."
          trivy image \
            ${{ env.REGISTRY }}/patient-service:${{ github.sha }} \
            --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 1 \
            --format table \
            --ignore-unfixed

      - name: Scan Appointment Service image
        run: |
          echo "🔍 Scanning Appointment Service image for vulnerabilities..."
          trivy image \
            ${{ env.REGISTRY }}/appointment-service:${{ github.sha }} \
            --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 1 \
            --format table \
            --ignore-unfixed

      - name: Generate SBOM
        run: |
          echo "📋 Generating Software Bill of Materials..."
          trivy image \
            ${{ env.REGISTRY }}/patient-service:${{ github.sha }} \
            --format cyclonedx \
            --output patient-service-sbom.json
          
          trivy image \
            ${{ env.REGISTRY }}/appointment-service:${{ github.sha }} \
            --format cyclonedx \
            --output appointment-service-sbom.json
          
          echo "SBOM files generated successfully"

  # PHASE 5: TERRAFORM INFRASTRUCTURE
  terraform_infrastructure:
    name: "5. Terraform Infrastructure - ${{ github.event.inputs.environment || 'dev' }}"
    runs-on: ubuntu-latest
    needs: 
      - checkout_and_setup
      - build_and_push_images
      - security_scan_acr
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Format Check
        run: |
          terraform -chdir=terraform/environments/${{ github.event.inputs.environment || 'dev' }} fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform -chdir=terraform/environments/${{ github.event.inputs.environment || 'dev' }} init \
            -backend-config="resource_group_name=${{ env.RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ env.STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${{ github.event.inputs.environment || 'dev' }}.tfstate" \
            -input=false \
            -upgrade

      - name: Terraform Validate
        run: |
          terraform -chdir=terraform/environments/${{ github.event.inputs.environment || 'dev' }} validate

      - name: Terraform Plan
        run: |
          terraform -chdir=terraform/environments/${{ github.event.inputs.environment || 'dev' }} plan \
            -input=false \
            -var="resource_group_name=${{ env.RESOURCE_GROUP_NAME }}" \
            -var="acr_name=${{ env.ACR_NAME }}" \
            -var="aks_cluster_name=${{ env.AKS_CLUSTER_NAME }}" \
            -var="environment=${{ github.event.inputs.environment || 'dev' }}" \
            -var="location=eastus" \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -out=tfplan

      - name: Terraform Apply
        if: github.event_name != 'pull_request'
        run: |
          terraform -chdir=terraform/environments/${{ github.event.inputs.environment || 'dev' }} apply \
            -auto-approve \
            -input=false \
            tfplan

      - name: Configure kubectl
        if: github.event_name != 'pull_request'
        run: |
          echo "🔧 Configuring kubectl for AKS cluster: ${{ env.AKS_CLUSTER_NAME }}"
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing
          
          echo "✅ kubectl configured successfully"

      - name: Verify AKS cluster
        if: github.event_name != 'pull_request'
        run: |
          echo "=== AKS Cluster Info ==="
          kubectl cluster-info
          
          echo "=== Nodes ==="
          kubectl get nodes -o wide
          
          echo "=== System Pods ==="
          kubectl get pods -n kube-system
          
          echo "✅ AKS cluster is ready"

  # PHASE 6: HELM DEPLOYMENT
  helm_deployment:
    name: "6. Helm Deployment - ${{ github.event.inputs.environment || 'dev' }}"
    runs-on: ubuntu-latest
    needs: 
      - terraform_infrastructure
      - build_and_push_images
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure kubectl
        run: |
          echo "🔧 Configuring kubectl for AKS cluster: ${{ env.AKS_CLUSTER_NAME }}"
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'

      - name: Create namespace if not exists
        run: |
          if ! kubectl get namespace ${{ env.NAMESPACE }}; then
            kubectl create namespace ${{ env.NAMESPACE }}
            echo "✅ Created namespace: ${{ env.NAMESPACE }}"
          else
            echo "ℹ️  Namespace ${{ env.NAMESPACE }} already exists"
          fi

      - name: Create ACR pull secret
        run: |
          kubectl create secret docker-registry acr-pull-secret \
            --namespace ${{ env.NAMESPACE }} \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ secrets.ACR_USERNAME }} \
            --docker-password=${{ secrets.ACR_PASSWORD }} \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "✅ ACR pull secret created"

      - name: Deploy Healthcare App with Helm
        run: |
          echo "🚀 Deploying Healthcare App with Helm..."
          
          # Check if values file exists for environment
          VALUES_FILE="${{ env.HELM_CHART_DIR }}/healthcare-app/values-${{ github.event.inputs.environment || 'dev' }}.yaml"
          VALUES_ARG=""
          if [ -f "$VALUES_FILE" ]; then
            VALUES_ARG="--values $VALUES_FILE"
            echo "📁 Using values file: $VALUES_FILE"
          else
            echo "ℹ️  No specific values file found for environment, using defaults"
          fi
          
          helm upgrade --install ${{ env.HELM_RELEASE_NAME }} \
            ${{ env.HELM_CHART_DIR }}/healthcare-app \
            --namespace ${{ env.NAMESPACE }} \
            $VALUES_ARG \
            --set global.environment=${{ github.event.inputs.environment || 'dev' }} \
            --set patientService.image.repository=${{ env.REGISTRY }}/patient-service \
            --set patientService.image.tag=${{ github.sha }} \
            --set patientService.image.pullPolicy=Always \
            --set appointmentService.image.repository=${{ env.REGISTRY }}/appointment-service \
            --set appointmentService.image.tag=${{ github.sha }} \
            --set appointmentService.image.pullPolicy=Always \
            --set global.imagePullSecrets[0].name=acr-pull-secret \
            --wait \
            --timeout 600s \
            --atomic
          
          echo "✅ Helm deployment completed"

      - name: Verify Helm deployments
        run: |
          echo "=== Helm Releases ==="
          helm list --namespace ${{ env.NAMESPACE }}
          
          echo "=== Healthcare App Status ==="
          helm status ${{ env.HELM_RELEASE_NAME }} --namespace ${{ env.NAMESPACE }}
          
          echo "✅ Helm deployment verified"

  # PHASE 7: VERIFICATION & SMOKE TESTS
  verify_deployment:
    name: "7. Verify Deployment - ${{ github.event.inputs.environment || 'dev' }}"
    runs-on: ubuntu-latest
    needs: helm_deployment
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure kubectl
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Verify deployment resources
        run: |
          echo "=== Cluster Info ==="
          kubectl cluster-info
          
          echo "=== All Resources in ${{ env.NAMESPACE }} ==="
          kubectl get all -n ${{ env.NAMESPACE }}
          
          echo "=== Pods Details ==="
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide
          
          echo "=== Services ==="
          kubectl get services -n ${{ env.NAMESPACE }}
          
          echo "=== Ingress ==="
          kubectl get ingress -n ${{ env.NAMESPACE }} 2>/dev/null || echo "No ingress found"
          
          echo "=== Persistent Volumes ==="
          kubectl get pv,pvc -n ${{ env.NAMESPACE }} 2>/dev/null || echo "No PV/PVC found"

      - name: Wait for pods to be ready
        run: |
          echo "⏳ Waiting for Patient Service pods..."
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=patient-service \
            -n ${{ env.NAMESPACE }} \
            --timeout=300s
          
          echo "⏳ Waiting for Appointment Service pods..."
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=appointment-service \
            -n ${{ env.NAMESPACE }} \
            --timeout=300s
          
          echo "✅ All pods are ready"

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests..."
          
          # Get pod names
          PATIENT_POD=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=patient-service -o jsonpath='{.items[0].metadata.name}')
          APPOINTMENT_POD=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=appointment-service -o jsonpath='{.items[0].metadata.name}')
          
          echo "Patient Service Pod: $PATIENT_POD"
          echo "Appointment Service Pod: $APPOINTMENT_POD"
          
          # Test internal pod connectivity
          echo "🔍 Testing Patient Service health endpoint internally..."
          kubectl exec -n ${{ env.NAMESPACE }} $PATIENT_POD -- curl -s http://localhost:3000/health || echo "Patient service health check failed"
          
          echo "🔍 Testing Appointment Service health endpoint internally..."
          kubectl exec -n ${{ env.NAMESPACE }} $APPOINTMENT_POD -- curl -s http://localhost:3001/health || echo "Appointment service health check failed"
          
          # Test service connectivity
          PATIENT_SERVICE=$(kubectl get svc -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=patient-service -o jsonpath='{.items[0].metadata.name}')
          APPOINTMENT_SERVICE=$(kubectl get svc -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=appointment-service -o jsonpath='{.items[0].metadata.name}')
          
          echo "🔍 Testing Patient Service via service..."
          kubectl exec -n ${{ env.NAMESPACE }} $PATIENT_POD -- curl -s http://$PATIENT_SERVICE:3000/health || echo "Patient service via service failed"
          
          echo "🔍 Testing Appointment Service via service..."
          kubectl exec -n ${{ env.NAMESPACE }} $APPOINTMENT_POD -- curl -s http://$APPOINTMENT_SERVICE:3001/health || echo "Appointment service via service failed"
          
          echo "✅ All smoke tests passed"

      - name: Deployment success notification
        run: |
          echo "🎉 Healthcare App successfully deployed to ${{ github.event.inputs.environment || 'dev' }} environment"
          echo ""
          echo "📊 Deployment Summary:"
          echo "  - Environment: ${{ github.event.inputs.environment || 'dev' }}"
          echo "  - Resource Group: ${{ env.RESOURCE_GROUP_NAME }}"
          echo "  - AKS Cluster: ${{ env.AKS_CLUSTER_NAME }}"
          echo "  - ACR: ${{ env.ACR_NAME }}"
          echo "  - Namespace: ${{ env.NAMESPACE }}"
          echo "  - Image Tag: ${{ github.sha }}"
          echo "  - Helm Release: ${{ env.HELM_RELEASE_NAME }}"
          echo ""
          echo "✅ Services are now available and healthy"

  # PHASE 8: CLEANUP (Optional - for dev environment)
  cleanup:
    name: "8. Cleanup Old Images"
    runs-on: ubuntu-latest
    needs: verify_deployment
    if: |
      always() && 
      (github.event.inputs.environment == 'dev' || 
       github.ref == 'refs/heads/lbg-demo') &&
      needs.verify_deployment.result == 'success'
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Cleanup old ACR images
        run: |
          echo "🧹 Cleaning up old images from ACR..."
          
          # Keep only last 5 images for each repository
          echo "🔍 Cleaning Patient Service images..."
          az acr run --registry ${{ env.ACR_NAME }} \
            --cmd "acr purge --filter 'patient-service:.*' --keep 5 --ago 1d --untagged" \
            /dev/null || echo "⚠️ Patient service cleanup completed with warnings"
          
          echo "🔍 Cleaning Appointment Service images..."
          az acr run --registry ${{ env.ACR_NAME }} \
            --cmd "acr purge --filter 'appointment-service:.*' --keep 5 --ago 1d --untagged" \
            /dev/null || echo "⚠️ Appointment service cleanup completed with warnings"
          
          echo "✅ Cleanup completed successfully"