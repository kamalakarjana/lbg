apiVersion: v1
kind: Service
metadata:
  name: patient-service
  namespace: healthcare-ns-dev
  labels:
    app: patient-service
    version: "2.1.0-dev"
    environment: "dev"
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "false"
    service.beta.kubernetes.io/azure-dns-label-name: "patient-service-dev"
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/metrics"
    environment: "dev"
spec:
  selector:
    app: patient-service
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  - name: metrics
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: admin
    port: 3001
    targetPort: 3001
    protocol: TCP
  type: LoadBalancer
  sessionAffinity: None
  externalTrafficPolicy: Cluster
  loadBalancerIP: ""