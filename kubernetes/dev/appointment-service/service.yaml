apiVersion: v1
kind: Service
metadata:
  name: appointment-service
  namespace: healthcare-ns-dev
  labels:
    app: appointment-service
    version: "1.2.0-dev"
    environment: "dev"
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "false"
    service.beta.kubernetes.io/azure-dns-label-name: "appointment-service-dev"
    prometheus.io/scrape: "true"
    prometheus.io/port: "3001"
    prometheus.io/path: "/metrics"
    environment: "dev"
spec:
  selector:
    app: appointment-service
  ports:
  - name: http
    port: 80
    targetPort: 3001
    protocol: TCP
  - name: metrics
    port: 3001
    targetPort: 3001
    protocol: TCP
  - name: admin
    port: 3002
    targetPort: 3002
    protocol: TCP
  type: LoadBalancer
  sessionAffinity: None
  externalTrafficPolicy: Cluster
  loadBalancerIP: ""