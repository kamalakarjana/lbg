apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-dev
  namespace: healthcare-ns-dev
data:
  node_env: "development"
  log_level: "debug"
  max_requests: "500"
  timeout: "60s"
  cors_origin: "*"
  rate_limit: "50"
  app_name: "Healthcare App Dev"
  app_version: "2.0.0-dev"
  debug_mode: "true"
  enable_swagger: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: patient-config-dev
  namespace: healthcare-ns-dev
data:
  service_name: "patient-service"
  service_version: "2.1.0-dev"
  max_patients_per_page: "25"
  default_timeout: "60s"
  enable_debug_endpoints: "true"
  database_name: "healthcare_dev"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: appointment-config-dev
  namespace: healthcare-ns-dev
data:
  service_name: "appointment-service"
  service_version: "1.2.0-dev"
  max_appointments_per_page: "25"
  default_timeout: "60s"
  patient_service_url: "http://patient-service.healthcare-ns-dev.svc.cluster.local"
  enable_debug_endpoints: "true"
  database_name: "healthcare_dev"