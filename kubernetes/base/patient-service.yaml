apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
  namespace: healthcare-${ENVIRONMENT}
spec:
  replicas: ${REPLICA_COUNT}
  selector:
    matchLabels:
      app: patient-service
  template:
    metadata:
      labels:
        app: patient-service
    spec:
      containers:
      - name: patient-service
        image: kamalj2kkkk.azurecr.io/patient-service:${IMAGE_TAG}
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: patient-service
  namespace: healthcare-${ENVIRONMENT}
spec:
  selector:
    app: patient-service
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
