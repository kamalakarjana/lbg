{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "healthcare-app.fullname" . }}-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "healthcare-app.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: patient-service
                port:
                  number: 3000
          - path: {{ .path }}/patient
            pathType: {{ .pathType }}
            backend:
              service:
                name: patient-service
                port:
                  number: 3000
          - path: {{ .path }}/appointment
            pathType: {{ .pathType }}
            backend:
              service:
                name: appointment-service
                port:
                  number: 3001
          {{- end }}
    {{- end }}
{{- end }}