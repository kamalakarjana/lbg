{{- if .Values.appointmentService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "appointment-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.appointmentService.replicaCount }}
  selector:
    matchLabels:
      app: appointment-service
  template:
    metadata:
      labels:
        app: appointment-service
        {{- include "appointment-service.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: appointment-service
          image: {{ include "appointment-service.image" . }}
          imagePullPolicy: {{ .Values.appointmentService.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.appointmentService.service.targetPort }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "{{ .Values.appointmentService.service.targetPort }}"
            - name: DB_HOST
              value: "appointment-db-dev"
          {{- with .Values.appointmentService.livenessProbe }}
          livenessProbe:
            httpGet:
              path: {{ .httpGet.path }}
              port: {{ .httpGet.port }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
          {{- end }}
          {{- with .Values.appointmentService.readinessProbe }}
          readinessProbe:
            httpGet:
              path: {{ .httpGet.path }}
              port: {{ .httpGet.port }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.appointmentService.resources | nindent 12 }}
{{- end }}