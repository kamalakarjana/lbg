name: Terraform CI/CD

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main ]

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  terraform:
    name: 'Terraform - ${{ github.ref_name }}'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2

    - name: Terraform Format
      id: fmt
      run: terraform fmt -check -recursive
      working-directory: ./terraform

    - name: Terraform Init
      id: init
      run: |
        terraform init \
          -backend-config="resource_group_name=rg-healthapp01" \
          -backend-config="storage_account_name=sthealthapp01" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=terraform-${{ github.ref_name }}.tfstate"
      working-directory: ./terraform

    - name: Terraform Validate
      id: validate
      run: terraform validate -no-color
      working-directory: ./terraform

    - name: Determine Environment
      id: env
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "ENVIRONMENT=prod" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
          echo "ENVIRONMENT=staging" >> $GITHUB_OUTPUT
        else
          echo "ENVIRONMENT=dev" >> $GITHUB_OUTPUT
        fi

    - name: Terraform Plan
      id: plan
      run: terraform plan -var-file=environments/${{ steps.env.outputs.ENVIRONMENT }}.tfvars -no-color
      working-directory: ./terraform

    - name: Terraform Apply
      id: apply
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop')
      run: terraform apply -var-file=environments/${{ steps.env.outputs.ENVIRONMENT }}.tfvars -auto-approve
      working-directory: ./terraform
